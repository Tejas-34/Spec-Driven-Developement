{% extends "base.html" %}

{% block title %}Register - FocusSprint{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-panel">
        <div class="auth-header">
            <i class="fa-solid fa-bolt auth-logo-icon"></i>
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join FocusSprint and unlock your peak performance</p>
        </div>
        
        <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="e.g., alex_sprint" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="e.g., alex@focus.com" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Choose a strong password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password"><i class="fa-solid fa-shield-halved"></i> Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <span>Start Sprinting</span> <i class="fa-solid fa-chevron-right"></i>
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}" class="auth-link">Log In Here</a></p>
        </div>
    </div>
</div>
{% endblock %}
