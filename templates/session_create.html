{% extends "base.html" %}

{% block title %}Start Focus Session - FocusSprint{% endblock %}

{% block content %}
<div class="session-create-wrapper">
    <div class="glass-panel session-create-card">
        <div class="session-create-header">
            <i class="fa-solid fa-stopwatch text-glow-cyan animate-pulse"></i>
            <h2>Initialize Focus Session</h2>
            <p>Set your targets, eliminate distractions, and prime your mind for deep work.</p>
        </div>
        
        <form action="{{ url_for('session.start_session') }}" method="POST" class="session-create-form">
            <div class="form-group">
                <label for="title"><i class="fa-solid fa-t"></i> Task Name / Sprint Objective</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="e.g., Solving LeetCode 3Sum algorithm" required autocomplete="off">
            </div>
            
            <div class="form-group-row">
                <div class="form-group">
                    <label for="category"><i class="fa-solid fa-tags"></i> Task Category</label>
                    <select id="category" name="category" class="form-control" required>
                        <option value="Study">Study</option>
                        <option value="Coding" selected>Coding</option>
                        <option value="Revision">Revision</option>
                        <option value="Design">Design</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="duration"><i class="fa-solid fa-clock"></i> Focus Duration</label>
                    <select id="duration" name="duration" class="form-control" required>
                        <option value="25" selected>25 mins (Pomodoro)</option>
                        <option value="45">45 mins</option>
                        <option value="60">60 mins</option>
                        <option value="custom">Custom Minutes</option>
                    </select>
                </div>
            </div>

            <!-- Custom minutes -->
            <div class="form-group d-none" id="custom-minutes-container">
                <label for="custom_minutes"><i class="fa-solid fa-stopwatch text-cyan"></i> Custom Duration (Minutes)</label>
                <input type="number" id="custom_minutes" name="custom_minutes" class="form-control" min="1" max="180" value="30">
            </div>

            <div class="form-group">
                <label for="description"><i class="fa-solid fa-bullseye"></i> Specific Target / Checklist Goal</label>
                <textarea id="description" name="description" class="form-control" rows="3" placeholder="Write exactly what you want to have finished when the bell rings..."></textarea>
            </div>
            
            <div class="form-actions">
                <a href="{{ url_for('dashboard.home') }}" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-stopwatch"></i> Launch Active Timer</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const durationSelect = document.getElementById('duration');
        const customMinutesContainer = document.getElementById('custom-minutes-container');
        
        durationSelect.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                customMinutesContainer.classList.remove('d-none');
                document.getElementById('custom_minutes').setAttribute('required', 'true');
            } else {
                customMinutesContainer.classList.add('d-none');
                document.getElementById('custom_minutes').removeAttribute('required');
            }
        });
    });
</script>
{% endblock %}
