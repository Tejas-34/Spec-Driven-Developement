{% extends "base.html" %}
{% block title %}New Session | FocusSprint{% endblock %}
{% block head %}
<script defer src="{{ url_for('static', filename='js/session-create.js') }}"></script>
{% endblock %}
{% block content %}
<section class="form-layout">
    <form method="post" class="glass-card session-form">
        <div class="panel-head">
            <h1>Create focus session</h1>
            <span class="pill">Ctrl/⌘ + Enter to submit</span>
        </div>
        <label>Task title
            <input type="text" name="title" placeholder="Dynamic programming revision" required>
        </label>
        <label>Category
            <input type="text" name="category" placeholder="DSA, College, Interview">
        </label>
        <label>Duration
            <select name="duration_minutes" id="durationSelect">
                <option value="25">25 minutes</option>
                <option value="45">45 minutes</option>
                <option value="60">60 minutes</option>
                <option value="custom">Custom</option>
            </select>
        </label>
        <label id="customDurationRow" class="hidden">Custom duration (minutes)
            <input type="number" name="custom_duration" min="5" placeholder="90">
        </label>
        <label>Goal / description
            <textarea name="goal" rows="4" placeholder="Complete two graph problems without checking hints."></textarea>
        </label>
        <button type="submit" class="btn btn-primary">Start session</button>
    </form>
</section>
{% endblock %}
