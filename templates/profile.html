{% extends "base.html" %}
{% block title %}Profile | FocusSprint{% endblock %}
{% block content %}
<section class="form-layout">
    <form method="post" class="glass-card session-form">
        <div class="panel-head">
            <h1>Profile settings</h1>
            <span class="pill">Personalize your workspace</span>
        </div>
        <label>Username
            <input type="text" name="username" value="{{ current_user.username }}" required>
        </label>
        <label>Bio
            <textarea name="bio" rows="4">{{ current_user.bio }}</textarea>
        </label>
        <label>Daily target minutes
            <input type="number" name="daily_target_minutes" min="25" value="{{ current_user.daily_target_minutes }}">
        </label>
        <label>Theme
            <select name="theme">
                <option value="dark" {% if current_user.theme == 'dark' %}selected{% endif %}>Dark</option>
                <option value="light" {% if current_user.theme == 'light' %}selected{% endif %}>Light</option>
            </select>
        </label>
        <button type="submit" class="btn btn-primary">Save changes</button>
    </form>
</section>
{% endblock %}
