{% extends "base.html" %}

{% block title %}Settings - FocusSprint{% endblock %}

{% block content %}
<div class="settings-wrapper">
    <div class="glass-panel settings-card">
        <div class="settings-header">
            <h2><i class="fa-solid fa-gears text-purple"></i> Settings</h2>
            <p>Update your credentials, goals, or customize your user experience.</p>
        </div>
        
        <form action="{{ url_for('dashboard.settings') }}" method="POST" class="settings-form">
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" id="username" name="username" class="form-control" value="{{ current_user.username }}" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" class="form-control" value="{{ current_user.email }}" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label><i class="fa-solid fa-palette"></i> Interface Theme Preference</label>
                <div class="theme-selector-cards">
                    <div class="theme-select-card active" id="theme-dark-card">
                        <i class="fa-solid fa-moon"></i>
                        <span>Futuristic Dark</span>
                    </div>
                    <div class="theme-select-card" id="theme-light-card">
                        <i class="fa-solid fa-sun"></i>
                        <span>Neon Light</span>
                    </div>
                </div>
            </div>

            <div class="form-group-row">
                <div class="form-group">
                    <label><i class="fa-solid fa-clock"></i> Date Registered</label>
                    <input type="text" class="form-control bg-disabled" value="{{ current_user.created_at.strftime('%Y-%m-%d %H:%M:%S') }}" readonly>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-fire text-orange"></i> Streaks Maintained</label>
                    <input type="text" class="form-control bg-disabled animate-pulse" value="{{ current_user.streak }} consecutive days" readonly>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-check"></i> <span>Save Changes</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Add logic to select theme option inside settings form
    document.addEventListener('DOMContentLoaded', () => {
        const darkCard = document.getElementById('theme-dark-card');
        const lightCard = document.getElementById('theme-light-card');
        
        function refreshCards() {
            if (document.body.classList.contains('light-mode')) {
                darkCard.classList.remove('active');
                lightCard.classList.add('active');
            } else {
                lightCard.classList.remove('active');
                darkCard.classList.add('active');
            }
        }
        
        refreshCards();
        
        darkCard.addEventListener('click', () => {
            document.body.classList.remove('light-mode');
            document.body.classList.add('dark-mode');
            localStorage.setItem('focus-theme', 'dark');
            refreshCards();
            
            // Sync side button
            const sideBtn = document.getElementById('theme-toggle-btn');
            if (sideBtn) {
                sideBtn.querySelector('i').className = 'fa-solid fa-moon';
                sideBtn.querySelector('span').innerText = 'Dark Mode';
            }
        });
        
        lightCard.addEventListener('click', () => {
            document.body.classList.remove('dark-mode');
            document.body.classList.add('light-mode');
            localStorage.setItem('focus-theme', 'light');
            refreshCards();
            
            // Sync side button
            const sideBtn = document.getElementById('theme-toggle-btn');
            if (sideBtn) {
                sideBtn.querySelector('i').className = 'fa-solid fa-sun text-yellow';
                sideBtn.querySelector('span').innerText = 'Light Mode';
            }
        });
    });
</script>
{% endblock %}
